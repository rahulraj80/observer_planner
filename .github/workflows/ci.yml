# Continuous-integration gates — run on every PR + every push to
# main. Catches frontend type errors, Go vet/test regressions, and
# the "I forgot to run `make web-build` before committing" class of
# bug that silently shipped pre-v1.6.0.
#
# Tagged-release builds are handled by npm-release.yml; this file is
# the pre-merge / pre-tag safety net. scripts/release.sh refuses to tag
# a commit unless a FULL run of this workflow (a workflow_dispatch) and
# ci-private completed green for that exact sha
# (D-602, D-609; docs/release-runbook.md "Green before tag").
#
# What runs when (D-602, D-609). The `plan` job decides; every other job
# needs it:
#   push to main / integration/**, pull_request (a PARTIAL run):
#       every job, but the go test shards test only the packages the
#       change can affect (scripts/ci/cipkgs affected: changed packages
#       plus their reverse test dependencies; a shared input such as
#       go.mod, ci.yml, scripts/ci, top-level testdata or the
#       Makefiles tests everything; a migration file is an input of its
#       own migrations package), only the packages that use concurrency
#       (scripts/ci/cipkgs race) run with -race, and a package not on
#       the fresh list (cipkgs fresh) may replay a cached test result.
#       omit-tags runs the distro sets and no_obs in one job.
#   workflow_dispatch (a FULL run): every job, every test package with
#       -count=1, -race on the same concurrent list as a push (every
#       package when go.mod or go.sum changed since the previous
#       release), and the full omit-tag list in batches (vet every set,
#       full tests for the four editions). A FULL run is what the release
#       gate accepts. No schedule: removed 2026-10-20 by
#       operator ruling (no scheduled Actions).
#   v* tag push: only the full omit-tag list, against the tagged commit
#       (path filters never apply to tag pushes), and only when no green
#       full dispatch run already covers that exact sha (the plan job's
#       `proven` step; release.sh tags only such a sha, so a normal release
#       repeats nothing).
#   paths-ignore: a push or PR that touches ONLY the paths below skips
#       the workflow. Each entry is one no job here reads: Go tests read
#       docs/*.md, docs/openapi, docs/recipes,
#       docs/plans/agent-access-research and website/docs-src, so those
#       are deliberately NOT ignored; website/track-gen is a package of
#       the root module. A docs-only HEAD therefore has no ci run, and
#       release.sh tells you to dispatch one before tagging.

name: ci

on:
  pull_request:
    paths-ignore:
      - 'docs/handovers/**'
      - 'docs/audits/**'
      - 'docs/decisions/**'
      - 'docs/strategy/**'
      - 'docs/demos/**'
      - 'docs/plans/*.md'
      - 'marketing/**'
      - 'design/**'
      - 'website/*.html'
      - 'website/*.txt'
      - 'website/*.xml'
      - 'website/_redirects'
      - 'website/_worker.js'
      - 'website/.well-known/**'
      - 'website/arcade/**'
      - 'website/arcade-src/**'
      - 'website/assets/**'
      - 'website/deck/**'
      - 'website/docs/**'
      - 'website/docs-tools/**'
      - 'website/legal/**'
      - 'website/pages-src/**'
      - 'website/tools/**'
      - 'PROGRESS.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'kickstart-prompt.md'
      - 'superbased-final-spec-v2.md'
  push:
    # integration/** too (P3-07): long-lived integration branches merge many
    # lanes before main, and the embed drift gates must see them.
    branches: [main, 'integration/**']
    # v* tags run only the full omit-tag matrix (see the header).
    tags: ['v*']
    # Same list as pull_request above; keep the two in step.
    paths-ignore:
      - 'docs/handovers/**'
      - 'docs/audits/**'
      - 'docs/decisions/**'
      - 'docs/strategy/**'
      - 'docs/demos/**'
      - 'docs/plans/*.md'
      - 'marketing/**'
      - 'design/**'
      - 'website/*.html'
      - 'website/*.txt'
      - 'website/*.xml'
      - 'website/_redirects'
      - 'website/_worker.js'
      - 'website/.well-known/**'
      - 'website/arcade/**'
      - 'website/arcade-src/**'
      - 'website/assets/**'
      - 'website/deck/**'
      - 'website/docs/**'
      - 'website/docs-tools/**'
      - 'website/legal/**'
      - 'website/pages-src/**'
      - 'website/tools/**'
      - 'PROGRESS.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'kickstart-prompt.md'
      - 'superbased-final-spec-v2.md'
  # The nightly schedule was removed 2026-10-20 by operator ruling (no
  # scheduled Actions); a FULL run is dispatched by hand before a release.
  # `since` (P-222, 2026-11-01): empty = the FULL run. A 40-hex sha = a
  # NARROWED release-gate run for a REPEAT release commit, tested against
  # that sha, which must be the cycle's green full run (see the plan job).
  workflow_dispatch:
    inputs:
      since:
        description: 'Empty for the FULL run. For a repeat release commit only: the sha of this cycle''s green full ci run to narrow against (P-222).'
        required: false
        default: ''
        type: string

# The run describes itself: release.sh reads the base a narrowed run was
# narrowed against from this title (cipkgs gate). Every other run keeps the
# default name (an empty run-name falls back to it).
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.since != '' && format('ci narrowed since {0}', inputs.since) || '' }}

# A newer push to the same ref cancels the run it replaces (main included:
# its successor contains the superseded commit and is tested in full).
# event_name is in the group so a main push and a dispatched full run
# never cancel each other. Tag runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Linux runner switch (lane CICD round 2, item C, 2026-11-01). The Linux
# test jobs (frontend, go, lint, go-test, omit-tags, plugins-build-drift,
# taxonomy-build-drift) take their runner label from the repository
# variable SBO_CI_LINUX_RUNNER and fall back to ubuntu-latest when it is
# unset or empty, so a third-party runner trial is one variable and its
# rollback is deleting it. None of these jobs reads a secret. plan (it
# holds actions: read and gates the release), distros (its smoke test
# needs the hosted kernel's sysctl and user namespaces) and installer (an
# OS matrix) stay on GitHub-hosted runners, as does every job outside this
# file (npm-release, signing, images, provenance, ci-private).
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------
  # plan (D-609): decides what this run tests, once, for every job.
  #   run   always true now that the nightly (which could skip itself) is
  #         gone; every job still gates on it.
  #   full  true on workflow_dispatch / v* tag: every test
  #         package with -count=1, -race on the concurrent list (every
  #         package after a go.mod / go.sum change since the previous
  #         release), full omit-tag list.
  #   shards / shard_count  the go test matrix, sized from the weight
  #         table for the packages this run tests (1 to 12 shards).
  #   omit  the omit-tag matrix: one distro job, or the full list in
  #         batches that share one warm build cache.
  #   tier  push | full | narrowed (P-222). A narrowed run is a dispatch
  #         with the `since` input: the base must have a green FULL
  #         dispatch on main, be an ancestor of this sha and come after
  #         the previous release tag (else the run fails, naming why).
  #         `cipkgs narrow` then decides: within its bounds the run tests
  #         `cipkgs affected base..sha` (-count=1, -race on the
  #         concurrent ones) and the omit-tag editions plus the single
  #         sets the diff can touch; outside them (go.mod, go.sum,
  #         ci.yml, .github/actions, scripts/ci, build scripts, Makefiles, top-level
  #         testdata, a file in no package, more than 300 files) it runs
  #         FULL. Every other job runs as on any dispatch.
  #         plan/narrow.txt records the base and the verdict.
  # The package lists (affected.txt, race.txt, fresh.txt) travel to the
  # shards as an artifact, so every shard tests from the same plan.
  # ----------------------------------------------------------------
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions: read lets a v* tag run ask whether a FULL dispatch of this
      # workflow already passed on the tagged sha (the `proven` step).
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      full: ${{ steps.plan.outputs.full }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      omit: ${{ steps.plan.outputs.omit }}
      tier: ${{ steps.plan.outputs.tier }}
    steps:
      - uses: actions/checkout@v5
      # v* tag push (CICD lane, 2026-11-01): release.sh tags only a sha whose
      # FULL ci run (a workflow_dispatch on main) is green, and that run
      # already ran this same omit-tag matrix on this same tree. Measured
      # 2026-11-01: the tag re-run cost about 315 billed minutes per release
      # (22% of a release) and gated nothing, since npm-release never waits
      # for it. So a tag run first asks the API for a successful dispatch run
      # of ci.yml on main for this exact sha; when one exists the matrix is
      # skipped with a notice. Any other answer (none found, an API error, a
      # tag cut with --allow-unverified-ci, the public repository whose tag
      # is a snapshot commit nobody dispatched) runs the full matrix as
      # before, so the skip can only drop a repeat of a green run.
      - id: proven
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # A green narrowed dispatch counts too: it is what the release gate
          # accepted for a repeat release commit (P-222).
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=workflow_dispatch&branch=main&status=success&per_page=1" --jq '.total_count' 2>/dev/null)
          if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -gt 0 ]; then
            echo "::notice::a successful release-gate ci run (workflow_dispatch on main) already covers ${GITHUB_SHA}; the omit-tag matrix is not repeated for ${GITHUB_REF_NAME}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "no successful full ci run found for ${GITHUB_SHA} (answer: '${n}'); running the full omit-tag matrix"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # Restore (never save) the lint job's cache family, without the disk
      # cleanup (lane CICD round 3, row 10, 2026-11-03). go list and cipkgs
      # need the module sources, not a build cache. The go family this step
      # used to restore is 2.3 GB compressed and about 9 GB unpacked, so it
      # needed the SDK cleanup first: in run 41274192950 the cleanup took 55 s
      # and the restore 70 s of the plan job's 2.8 minutes, and every other
      # job waits for this one. The lint family is the module cache plus what
      # go list writes (about 0.8 GB compressed, under 2 GB unpacked, with 13
      # GB free on the runner). Measured locally: with warm modules and a
      # cold build cache the plan step's commands take about 30 s (21 s on the
      # go family); with no cache at all, go list downloads the modules in
      # about 80 s, still less than the cleanup plus the old restore.
      - uses: ./.github/actions/go-cache
        if: steps.proven.outputs.skip != 'true'
        with:
          family: lint
          free-disk: 'false'
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PROVEN: ${{ steps.proven.outputs.skip }}
          SINCE: ${{ github.event_name == 'workflow_dispatch' && inputs.since || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p plan
          if [ "${PROVEN:-}" = true ]; then
            # Tag run of a sha a green full dispatch already covers: nothing
            # to repeat. The artifact still uploads so the run shape is fixed.
            : > plan/affected.txt; : > plan/race.txt; : > plan/fresh.txt
            { echo "run=true"; echo "full=true"; echo "tier=full"; echo "shards=[]"; echo "shard_count=0"; echo "omit=[]"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT:$REF" in
            workflow_dispatch:*|push:refs/tags/*) full=true ;;
            *) full=false ;;
          esac
          tier=push
          [ "$full" = true ] && tier=full
          # The previous release (race scope below, and the P-222 rule that
          # a narrowed base must come after it).
          prev=$(git ls-remote --tags --refs origin 'refs/tags/v*' \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vx "${GITHUB_REF_NAME}" | sort -V | tail -1 || true)
          narrow_tags=""
          if [ -n "${SINCE:-}" ]; then
            # P-222: a narrowed release-gate run. A base that does not qualify
            # fails the run: a narrowed title must never stand on a bad base.
            fail() { echo "::error::narrowed dispatch refused: $*. Dispatch without 'since' for the full run."; exit 1; }
            [[ "$SINCE" =~ ^[0-9a-f]{40}$ ]] || fail "since must be a full 40-hex commit sha"
            [ "$REF" = refs/heads/main ] || fail "a narrowed run counts only on main"
            base_state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SINCE" --limit 50 \
              --json status,conclusion,event,headBranch,displayTitle | go run ./scripts/ci/cipkgs gate base) \
              || fail "could not read the ci runs of $SINCE"
            [ "$base_state" = full ] || fail "$SINCE has no green FULL dispatch run on main"
            rel=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SINCE}...${GITHUB_SHA}" --jq .status) || fail "could not compare $SINCE with $GITHUB_SHA"
            case "$rel" in ahead|identical) ;; *) fail "$SINCE is not an ancestor of $GITHUB_SHA ($rel)" ;; esac
            [ -n "$prev" ] || fail "no previous release tag: the first release needs a full run"
            after=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${prev}...${SINCE}" --jq .status) || fail "could not compare $prev with $SINCE"
            [ "$after" = ahead ] || fail "$SINCE is not after the previous release $prev ($after): the first release commit of a cycle needs a full run"
            git fetch --no-tags --depth=1 origin "$SINCE" || fail "could not fetch $SINCE"
            go run ./scripts/ci/cipkgs narrow "$SINCE" "$GITHUB_SHA" > plan/narrow.txt
            echo "base=$SINCE" >> plan/narrow.txt
            cat plan/narrow.txt
            if grep -qx 'mode=narrowed' plan/narrow.txt; then
              tier=narrowed
              narrow_tags=$(sed -n 's/^tags=//p' plan/narrow.txt)
            else
              echo "::notice::narrowed dispatch runs FULL: $(sed -n 's/^reason=//p' plan/narrow.txt)"
            fi
            { echo "### ci narrowed since ${SINCE}"; echo; echo '```'; cat plan/narrow.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$tier" = narrowed ]; then
            go run ./scripts/ci/cipkgs affected "$SINCE" "$GITHUB_SHA" > plan/affected.txt
            go run ./scripts/ci/cipkgs race > plan/race.txt
          elif [ "$full" = true ]; then
            echo ALL > plan/affected.txt
            # Race scope (item 8 of the test-time plan): the same list a
            # push uses, unless go.mod or go.sum changed since the previous
            # release (a new toolchain or dependency), which races every
            # package. No previous release found or fetched: race every
            # package (cipkgs race --since with an empty base).
            if [ -n "$prev" ] && ! git fetch --no-tags --depth=1 origin "refs/tags/$prev:refs/tags/$prev"; then
              echo "::warning::could not fetch the previous release $prev; racing everything"
              prev=""
            fi
            echo "race scope base: ${prev:-none}"
            go run ./scripts/ci/cipkgs race --since "$prev" "$GITHUB_SHA" > plan/race.txt
          else
            base="${PR_BASE:-$PUSH_BEFORE}"
            if [ -n "$base" ] && [ -n "${base//0/}" ]; then
              git fetch --no-tags --depth=1 origin "$base" || echo "::warning::could not fetch base $base; testing everything"
            fi
            go run ./scripts/ci/cipkgs affected "$base" "$GITHUB_SHA" > plan/affected.txt
            go run ./scripts/ci/cipkgs race > plan/race.txt
          fi
          # Packages that never replay a cached test result (item 17): the
          # push tier lets the others replay; a full run replays nothing.
          go run ./scripts/ci/cipkgs fresh > plan/fresh.txt
          export SHARD_FILTER=plan/affected.txt RACE_FILTER=plan/race.txt
          # About 45 shard-minutes of package-seconds per shard (1.9
          # package-s per shard-s on a 2-vCPU runner), at most 12 shards.
          count=$(scripts/ci/go-test-shards.sh plan 12 5100)
          if [ "$count" -gt 0 ]; then
            shards=$(seq 0 $((count - 1)) | jq -R 'tonumber' | jq -sc .)
          else
            shards='[]'
          fi
          if [ "$tier" = narrowed ]; then
            # The four editions plus the single sets the diff can touch, in
            # two LPT batches (P-222).
            omit=$(seq 0 1 | jq -R --arg tags "$narrow_tags" '{name: ("narrowed " + . + "/2"), args: ("--scope narrow --tags \"" + $tags + "\" --batch " + . + "/2")}' | jq -sc .)
          elif [ "$full" = true ]; then
            omit=$(seq 0 5 | jq -R '{name: ("batch " + . + "/6"), args: ("--batch " + . + "/6")}' | jq -sc .)
          else
            omit='[{"name":"distro sets","args":"--scope distro"}]'
          fi
          echo "tier=$tier full=$full packages=$(grep -c . plan/affected.txt) race_packages=$(grep -c . plan/race.txt) shards=$count"
          { echo "run=true"; echo "full=$full"; echo "tier=$tier"; echo "shards=$shards"; echo "shard_count=$count"; echo "omit=$omit"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: test-plan
          path: plan/
          retention-days: 3

  # ----------------------------------------------------------------
  # React frontend gates: install, typecheck, build. Also asserts the
  # committed embedded dist matches what a fresh build produces — if
  # `web/src/` was edited without rerunning `make web-build`, this
  # job fails with a clear actionable message. Without this gate the
  # embedded bundle silently drifted from the React source.
  # ----------------------------------------------------------------
  frontend:
    name: frontend
    # Every job except omit-tags skips on tag pushes (header: "What runs
    # when").
    needs: plan
    if: needs.plan.outputs.run == 'true' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ vars.SBO_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: npm ci
        run: |
          cd web
          npm ci

      - name: typecheck
        run: |
          cd web
          npm run typecheck

      - name: unit and component tests
        # web/src/lib/*.test.ts under node's test runner, then the
        # component tests (web/scripts/test-components.mjs). Before item 15
        # of the test-time plan these ran only in lanes, never in CI.
        run: |
          cd web
          npm test

      - name: ui copy lint
        # Ratchet on internal names in UI text (snake_case identifiers,
        # section-sign references, config paths and keys): the per-root
        # counts in scripts/uicopylint/baseline.json may only go down
        # (docs/app-design-system.md "Copy rules"). Reads the TypeScript
        # AST, so comments and class names never count. Same wiring as
        # scripts/copylint: one cheap pass, no build.
        run: node scripts/uicopylint/uicopylint.mjs web/src

      - name: build
        run: |
          cd web
          npm run build

      - name: dist consistency check
        # Mirrors `make web-build`'s second half: regenerates the
        # embedded dir from web/dist and asserts it matches what's
        # committed. If it doesn't, the dev edited web/src/ but
        # forgot to commit the rebuilt bundle — a stale embed would
        # ship on the next release. The copy is scripts/sync-web-embed.sh
        # (source maps excluded), the same script `make web-build` runs.
        # `git status --porcelain` rather than `git diff` so a NEW
        # content-hashed chunk that was never committed also fails.
        run: |
          set -euo pipefail
          scripts/sync-web-embed.sh web/dist internal/intelligence/dashboard/webapp/dist
          drift=$(git status --porcelain -- internal/intelligence/dashboard/webapp/dist)
          if [ -n "$drift" ]; then
            echo "::error::Committed webapp/dist drifted from web/dist. Run \`make web-build\` and commit the result."
            echo "$drift" | head -40
            exit 1
          fi
          echo "embedded dist matches fresh build ✓"

  # ----------------------------------------------------------------
  # Go gates — vet, test, build. Pure-Go so no special toolchain
  # beyond setup-go. Frontend build is independent (this job doesn't
  # need a fresh dist to compile; the committed embed satisfies the
  # //go:embed directive at compile time, even if it's stale for the
  # purposes of the runtime UI).
  # ----------------------------------------------------------------
  go:
    name: go
    needs: plan
    if: needs.plan.outputs.run == 'true' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ vars.SBO_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: free runner disk (T-806)
        # This job fills the runner's root disk: the restored build cache
        # (about 2 GB compressed, several times that unpacked), then Linux
        # and Windows vet, the build, the toolchain tests and a
        # Windows compile of every package, each adding its own objects to
        # GOCACHE, and finally the Windows link of every main package. In
        # October 2026 the Windows compile step began failing with "no space
        # left on device". The image ships toolchains this job never
        # uses (.NET, Android SDK, GHC, CodeQL, Swift, docker images);
        # removing them returns well over 20 GB. The removals run in
        # parallel so the step stays short.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc /usr/local/.ghcup &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo rm -rf /usr/share/swift &
          sudo docker image prune --all --force > /dev/null &
          wait
          df -h /

      - uses: actions/checkout@v5

      - uses: ./.github/actions/go-cache
        id: go
        with:
          family: go

      - name: disk after cache restore
        run: |
          df -h /
          du -sh "$(go env GOCACHE)" "$(go env GOMODCACHE)" 2>/dev/null || true

      - name: vet
        run: |
          go vet ./...
          df -h / | tail -1

      - name: vet (windows)
        # `go vet` above type-checks only the Linux build; a
        # `//go:build windows` file or a test file that references
        # unix-only symbols (cmd/observer/attach_resume_test.go, DI-20,
        # 2026-09-02) compiles undetected until someone runs the suite on
        # a Windows host. Cross-vet the Windows build so that class is
        # red on CI, not on the operator's laptop.
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          df -h / | tail -1

      - name: copy lint
        # Spelling, no-dash copy, posture comment wording and the one
        # registry spelling: source-text lints that used to run as
        # Go tests in tests/invariant (D-612). One cheap pass, no race build.
        run: go run ./scripts/copylint

      # The `-race` test run used to live here as a single `go test -race
      # -timeout 40m ./...` step. It now runs in the sharded `go-test` job
      # below; see that job's comment block for the history.

      - name: build
        # `make build` skipped here — that target requires Node for
        # web-build, which the frontend job already verified. This
        # step exercises the Go compile path against the committed
        # embedded dist.
        run: |
          mkdir -p bin
          go build -trimpath -o bin/observer ./cmd/observer
          GOOS=windows GOARCH=amd64 go build -trimpath -o bin/antigravity-bridge.exe ./cmd/antigravity-bridge
          ls -l bin/
          df -h / | tail -1

      - name: latency regressions (no race)
        # The wall-clock latency tests (scripts/ci/latency-tests.txt) skip
        # in the test shards (SBO_SKIP_LATENCY_TESTS=1, a shard runs
        # dozens of packages on two cores) and internal/guard's two also
        # under the race detector (it inflates CPU-bound work 2-10x, and
        # the shared 2-core runner blew a 12x-widened ceiling on
        # 2026-09-16), so they are gated HERE, without -race, on an
        # otherwise idle runner. Each calls latencygate.Gate, which fails
        # a latency test missing from the list (item 20).
        run: |
          set -euo pipefail
          list=$(grep -v '^#' scripts/ci/latency-tests.txt | grep .)
          names=$(cut -f2 <<<"$list" | sort -u | paste -sd'|')
          pkgs=$(cut -f1 <<<"$list" | sort -u | sed 's#^#./#')
          # shellcheck disable=SC2086 # one word per package
          go test -count=1 -timeout 10m -run "^(${names})\$" $pkgs

      - name: toolchain invariant tests (no race)
        # tests/invariant tests that exec the Go toolchain (go build / go
        # list) run HERE, without -race, against the warm build cache; the
        # race shards skip them (SBO_SKIP_TOOLCHAIN_TESTS=1). The list is
        # scripts/ci/toolchain-tests.txt (D-609).
        run: |
          set -euo pipefail
          names=$(grep -v '^#' scripts/ci/toolchain-tests.txt | grep . | paste -sd'|')
          go test -count=1 -timeout 30m -run "^(${names})\$" ./tests/invariant/
          df -h / | tail -1

      - name: windows cross-compile
        # `go test ./...` and the build step above never compile any
        # `//go:build windows` file, and the build step's only Windows
        # target is cmd/antigravity-bridge — so a Windows-only break in
        # internal/processobs (peb_windows.go, procmetrics_windows.go,
        # enum_windows.go, and the ETW backend to come) ships undetected.
        # Compile-only; these packages have no Linux-runnable tests.
        run: |
          df -h / | tail -1
          GOOS=windows GOARCH=amd64 go build ./...
          df -h / | tail -1

      - name: disk report
        # Runs on failure too, so a disk shortfall names its consumer.
        if: ${{ !cancelled() }}
        run: |
          df -h /
          sudo du -sh "$(go env GOCACHE)" "$(go env GOMODCACHE)" /tmp "$RUNNER_TEMP" 2>/dev/null || true

      - name: save go cache (full runs only, D-612)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.go.outputs.gocache }}
            ${{ steps.go.outputs.gomodcache }}
          key: ${{ steps.go.outputs.key }}

  # ----------------------------------------------------------------
  # golangci-lint, in its own job (lane CICD round 2, item D, 2026-11-01).
  #
  # Why: run 41290821526 (v1.37.1's full gate) lost the `go` job twice at
  # this step, about 12.5 minutes into golangci-lint, with "The runner has
  # received a shutdown signal", while the same tree linted in 6.5 minutes
  # on run 41274192950. Lint time had drifted from 3 to 7 minutes before
  # 2026-10-20 to 10 to 25 minutes since. Two measured causes:
  #   1. The analysis cache was cold every run. golangci-lint-action keys
  #      its cache by week and go.sum and never re-saves on an exact hit, so
  #      a 2 MB entry saved by a cancelled run (this week's key) was
  #      restored all week and nothing better could replace it.
  #   2. Lint shared the job, and its memory, with a 7.6 GB build cache and
  #      every other Go step; a cold whole-tree lint (tests included,
  #      staticcheck, gosec, gocritic, unused) is the job's memory peak, and
  #      a runner that runs out of memory loses its agent, which GitHub
  #      reports as that shutdown signal.
  # What changed: lint runs here, beside `go`; the action's own cache is
  # off (skip-cache) and the analysis cache is ours, keyed per commit and
  # saved from every dispatch on main (restore falls back to the newest
  # entry), so it is warm instead of pinned to a stale entry; GOMEMLIMIT is
  # set to 70% of the runner's RAM so the Go GC works harder before the
  # kernel kills anything; and a sampler records peak memory, with any
  # OOM-killer line, in the job log, so the next failure names its cause.
  # The `go` job keeps vet, copy lint, build and the toolchain tests.
  # ----------------------------------------------------------------
  lint:
    name: lint
    needs: plan
    if: needs.plan.outputs.run == 'true' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ vars.SBO_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Its own cache family. golangci-lint type-checks every package from
      # source (go/packages with syntax), so the go job's 7.6 GB build cache
      # would buy little beyond the module cache and cost minutes to
      # restore. This family holds the module cache plus what `go list`
      # writes, and is saved below from a dispatch on main (D-612).
      - uses: ./.github/actions/go-cache
        id: go
        with:
          family: lint

      - name: memory guard and sampler
        run: |
          set -euo pipefail
          kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          echo "runner: $(nproc) vCPU, $((kib / 1024)) MiB RAM"
          echo "GOMEMLIMIT=$((kib * 7 / 10))KiB" >> "$GITHUB_ENV"
          echo "GOLANGCI_LINT_CACHE=$HOME/.cache/golangci-lint-ci" >> "$GITHUB_ENV"
          # Used memory every 5 s until the job ends (the runner reaps it).
          # shellcheck disable=SC2016 # expanded by the inner bash, not here
          nohup bash -c 'while :; do free -m | awk "NR==2 {print \$3}" >> "$RUNNER_TEMP/mem.log"; sleep 5; done' > /dev/null 2>&1 &

      - name: restore lint cache
        id: lintcache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/golangci-lint-ci
          key: golangci-lint-ci-v2.14.0-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-ci-v2.14.0-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}-
            golangci-lint-ci-v2.14.0-${{ runner.os }}-

      - name: lint
        # golangci-lint enforces the full .golangci.yml set, including
        # gofumpt + goimports formatting, errorlint, gosec, gocritic, and
        # gocyclo (threshold 30; see .golangci.yml for the documented
        # pre-existing exclusions). Joined CI in v1.7; the tree is clean.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # The cache is managed by the two cache steps around this one.
          skip-cache: true
          # v2.14.0 is the oldest golangci-lint that can lint this go.mod
          # (go 1.27.0). Its prebuilt binary is compiled with Go 1.27
          # (go1.27.0), so there is no "language version used to build
          # golangci-lint is lower than the targeted Go version" refusal
          # (v2.12.2, built with go1.26.2, refuses it), and it bundles
          # golang.org/x/tools v0.50.0, the first that reads Go 1.27 export
          # data. v2.13.2 is also built with go1.27.0 but bundles x/tools
          # v0.49.0, so every package fails type checking with "export
          # data version 5 is greater than maximum supported version 4".
          # The go1.27.3 patch move (lane RB1, GO-2026-6809) keeps v2.14.0.
          # Moved with the Go 1.27 toolchain (lane GO127); the previous
          # move was v2.12.2 with Go 1.26 (T-696), when .golangci.yml was
          # migrated to the v2 schema.
          version: v2.14.0

      - name: memory report
        if: ${{ always() }}
        run: |
          peak=$(sort -n "$RUNNER_TEMP/mem.log" 2>/dev/null | tail -1)
          echo "peak used memory: ${peak:-unknown} MiB of $(free -m | awk 'NR==2 {print $2}') MiB"
          du -sh "$GOLANGCI_LINT_CACHE" 2>/dev/null || true
          sudo dmesg 2>/dev/null | grep -i -E 'out of memory|oom-kill|killed process' | tail -5 || true

      # Saved from a dispatch on main (D-612), under this commit's key, so the
      # next run restores the newest caches.
      - name: save lint go cache
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.go.outputs.gocache }}
            ${{ steps.go.outputs.gomodcache }}
          key: ${{ steps.go.outputs.key }}

      - name: save lint cache
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.lintcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/golangci-lint-ci
          key: golangci-lint-ci-v2.14.0-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}

  # ----------------------------------------------------------------
  # Go race suite, sharded.
  #
  # History of the single-step version this replaces: -race catches the
  # watcher / proxy concurrency bugs that otherwise slip past until live
  # use, but it is slow. go test's default per-binary timeout is 10m; the
  # intelligence/dashboard suite blew that on CI runners (observed
  # 2026-07-11) so the step went to 25m, then 25m→40m on 2026-07-21 after
  # the v1.22.0 suite blew 25m twice — no deadlock, the package is just
  # large: every newTestServer runs the full migration chain, so the
  # binary scales with test count × migrations on 2-core runners. The real
  # fix for THAT package is still a template-DB copy in newTestServer.
  #
  # 2026-09-16: the treadmill ran out of road. The single
  # `go test -race -timeout 40m ./...` step took 5+ hours on the 2-core
  # private-repo runner and hit GitHub's hard 6 h JOB cap on three
  # consecutive pushes — killed mid-suite, no usable signal, so CI had
  # stopped being a gate. Hence the shards: scripts/ci/go-test-shards.sh
  # splits the test-package universe (`go list`, TestGoFiles OR
  # XTestGoFiles) into balanced buckets by a checked-in weight table, and
  # each matrix job runs exactly one bucket.
  #
  # -timeout 90m is the PER-TEST-BINARY timeout inside a shard, not the
  # shard's budget. It stays generous because internal/intelligence/dashboard
  # alone can exceed 40m under -race on a loaded runner; the loud failure
  # is now timeout-minutes: 120 on the job, well under the 6 h cap.
  #
  # Split packages (lane CICD, 2026-11-01): LPT cannot split one package, so
  # the slowest package bounded the matrix (cmd/observer alone took 83 min
  # of the 96-min shard in run 41274192950). The packages on
  # scripts/ci/go-test-splits.tsv are scheduled as <import>#<i>/<k> units
  # and go-test-run.sh runs each as a -run / -skip part of that package's
  # tests (cipkgs split); the k parts cover the package exactly once by
  # construction, and `shard plan` checks every part is assigned once.
  #
  # Shard count: the plan job sizes it (go-test-shards.sh plan) and hands
  # the matrix and SHARDS over together, and the `shard plan` step runs
  # `go-test-shards.sh check $SHARDS`, which fails the job if the split
  # does not cover the (filtered) universe exactly once, so a sharder bug
  # is red, never a silently unrun package.
  #
  # Scope (D-609): on a push or PR the universe is narrowed to the
  # affected packages; a workflow_dispatch runs every package, and the
  # release gate requires such a run. Both run -race only on the
  # concurrent packages (scripts/ci/cipkgs race), except that a full run
  # whose go.mod or go.sum changed since the previous release races every
  # package; tests/invariant never runs under -race (item 6 and item 8
  # of the test-time plan).
  #
  # Cache (D-602, D-604): every shard restores one shared compile cache
  # (family go-test, saved by shard 0), so an unchanged package is not recompiled
  # with -race on every push. A full run passes -count=1, so Go never
  # replays a cached test RESULT there. A push sets GO_TEST_REPLAY=1:
  # a package not on plan/fresh.txt may replay a result the restored
  # cache holds (item 17); end-to-end, live-database and LIVE-switch
  # packages keep -count=1.
  #
  # checkptr (D-604): -race also turns on -d=checkptr, the unsafe.Pointer
  # arithmetic checker, for every package. In modernc.org/sqlite and its
  # libc (machine-transpiled C) that checker was 40% of the CPU of a fresh
  # server migration (42s to 18s for one orgdb.Open), and the server
  # suites open thousands of SQLite databases, so the largest server
  # packages crossed the 90m per-binary timeout. The -gcflags
  # pattern below turns checkptr off ONLY for modernc.org/...: the race
  # detector itself still instruments those packages, and every package of
  # this module (and every other dependency) keeps checkptr.
  # ----------------------------------------------------------------
  go-test:
    name: go test (shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.run == 'true' && !startsWith(github.ref, 'refs/tags/') && needs.plan.outputs.shard_count != '0'
    runs-on: ${{ vars.SBO_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      SHARDS: ${{ needs.plan.outputs.shard_count }}
      SHARD_FILTER: plan/affected.txt
      RACE_FILTER: plan/race.txt
      FRESH_FILTER: plan/fresh.txt
      # Only the push tier may replay a cached result; a full or narrowed
      # release-gate run (P-222) runs every package it tests with -count=1.
      GO_TEST_REPLAY: ${{ needs.plan.outputs.tier == 'push' && '1' || '0' }}
      SBO_SKIP_TOOLCHAIN_TESTS: '1'
      SBO_SKIP_LATENCY_TESTS: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/go-cache
        id: go
        with:
          # One family for every shard, saved by shard 0 only (D-604): the
          # -race build of the shared dependencies is identical across
          # shards, and 12 per-shard caches would overrun the repository's
          # 10 GB cache budget.
          family: go-test

      - uses: actions/download-artifact@v6
        with:
          name: test-plan
          path: plan

      - name: shard plan
        # Honesty gate: union of all shards == the (filtered) universe, no
        # duplicates, no empty shard. Also prints the per-shard package
        # count and the estimated seconds, which is how we notice the
        # weight table has gone stale enough to matter.
        run: scripts/ci/go-test-shards.sh check "${SHARDS}"

      - name: test
        run: scripts/ci/go-test-run.sh ${{ matrix.shard }} "${SHARDS}"

      # Saved from a dispatched FULL run only (D-609): a push or a narrowed
      # dispatch (P-222) compiles just its affected packages, so its cache
      # would be a partial one, and the newest entry is what every shard
      # restores.
      - name: save go cache (full run, shard 0 only)
        if: ${{ !cancelled() && matrix.shard == 0 && github.event_name == 'workflow_dispatch' && needs.plan.outputs.tier == 'full' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.go.outputs.gocache }}
            ${{ steps.go.outputs.gomodcache }}
          key: ${{ steps.go.outputs.key }}

  # ----------------------------------------------------------------
  # Prebuilt node distros (modular packaging plan 5.2 / 5.9 "Every PR",
  # phase P3). Builds each distro for linux/amd64 through
  # scripts/build-distro.sh (tags from the catalog, never typed here),
  # runs the per-artifact proof gate (sbo-components proof: tags read
  # back from the binary, go list -deps package absence for every
  # excluded component that claims L1, linked modules equal the
  # closure, the binary's own report), writes the CycloneDX SBOM, then
  # starts the binary under scripts/distro-smoke.sh and checks it
  # listens on exactly its distro's default listeners. Build, prove and
  # smoke only: nothing is signed, uploaded or published.
  # ----------------------------------------------------------------
  distros:
    name: distro ${{ matrix.distro }}
    needs: plan
    if: needs.plan.outputs.run == 'true' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [minimal, developer, managed, full]
    steps:
      - uses: actions/checkout@v5

      # One cache family for the four editions, saved by the full leg only
      # (lane CICD round 3, 2026-11-03). Four per-edition families wrote
      # about 3.7 GB per full run into a 10 GB repository budget the other
      # families already filled, so entries were evicted: in the v1.37.0 full
      # run two of the four missed and rebuilt cold (140 and 214 s against 5
      # to 6 s warm). Measured with `go list -deps` per edition tag set
      # (CGO_ENABLED=0, as build-distro.sh builds): against the full
      # edition's build cache, minimal recompiles 20 of its 481 non-standard
      # packages, developer 4 of 828 and managed 22 of 1,012, so one shared
      # entry keeps every leg warm and frees about 2.8 GB per full run.
      - uses: ./.github/actions/go-cache
        id: go
        with:
          family: distro

      # The full distro needs obs, and the public tree has none: release.sh
      # strips cmd/observer/obs_wire.go and retags the stubs so the public
      # binary reports obs compiled out. A public `full` build is therefore
      # developer-shaped by design and its proof cannot pass; it is proven
      # where obs exists (the private tree, and the release that builds from
      # it).
      - name: full needs obs (absent on the public tree)
        if: matrix.distro == 'full' && hashFiles('cmd/observer/obs_wire.go') == ''
        run: echo "::notice::distro full skipped, this tree has no cmd/observer/obs_wire.go (the public snapshot)"

      - name: build + proof + SBOM
        if: matrix.distro != 'full' || hashFiles('cmd/observer/obs_wire.go') != ''
        run: scripts/build-distro.sh ${{ matrix.distro }} --proof

      - name: listener smoke
        if: matrix.distro != 'full' || hashFiles('cmd/observer/obs_wire.go') != ''
        # The harness runs in its own user, mount and network namespace.
        # Ubuntu 24.04 runners restrict unprivileged user namespaces by
        # AppArmor policy; lift that for this throwaway runner only.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          scripts/distro-smoke.sh bin/distro/observer-${{ matrix.distro }}-linux-amd64

      # The full leg compiles the superset of the untagged packages the
      # other three restore; they save nothing (see the restore above).
      - name: save go cache (full runs only, D-612; the full leg only)
        if: ${{ !cancelled() && matrix.distro == 'full' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.go.outputs.gocache }}
            ${{ steps.go.outputs.gomodcache }}
          key: ${{ steps.go.outputs.key }}

  # ----------------------------------------------------------------
  # Edition installers (T-729): scripts/install.sh is shellchecked and
  # run by scripts/test-install.sh against a fixture release signed with a
  # throwaway key (checksum, signature, every edition, uninstall); the
  # Windows twin runs scripts/test-install.ps1 the same way. Hermetic: every
  # case uses --from-dir, no network, no real key.
  # ----------------------------------------------------------------
  installer:
    name: installer ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.run == 'true' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # testdata/grokbot holds 218-character paths (base32 slice names the
      # adapter reads verbatim); under the private repo's longer checkout
      # root that passes Windows' 260-character limit and checkout fails.
      - name: long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false # the restore collides with the go.mod toolchain download (D-612)

      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh scripts/test-install.sh

      # The Windows sandbox driver's bundled files (lane SBX-P6, wired here
      # by lane SBX-P3B): offline checks of scripts/mxc-files.sh (a file
      # that does not match its pin, a missing file, owed pins and a failed
      # signature check each refuse to bundle). No network, no Windows.
      - name: mxc-files.sh
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/test-mxc-files.sh

      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/vendorsign" ./scripts/vendorsign
          VENDORSIGN_BIN="$RUNNER_TEMP/vendorsign" bash scripts/test-install.sh

      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP\vendorsign.exe" ./scripts/vendorsign
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-install.ps1 -VendorSign "$env:RUNNER_TEMP\vendorsign.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ----------------------------------------------------------------
  # Omit-tag variants (plan 5.9, risk R1 "stub rot"): every sbo_omit_*
  # tag a build line names, the no_obs alias and each distro's tag set
  # get `go vet ./...` (which type-checks every test file). The four
  # editions also run the full tests of the packages that hold a tagged
  # file; every single sbo_omit_* set runs vet only (operator decision
  # "Vet only", 2026-11-01: their tests were about 80 minutes of a full
  # run, vet about 211). The set list comes from the tree
  # (omit-tag-check.sh --list) and is filtered by the script itself, never
  # restated here (D-602, D-609):
  #   PR / branch push: one job, --scope distro: the distro sets (the
  #     entries carrying a sbo_distro_* stamp, which are the editions
  #     npm-release builds and publishes) and no_obs. `full` has no omit
  #     tag; the distros job builds, proves and smokes it on every push.
  #   workflow_dispatch, v* tag push: the whole list, i.e. also
  #     every single sbo_omit_* tag (custom-build.yml customer builds,
  #     which the release does not publish), in 6 batches (--batch i/6,
  #     LPT over scripts/ci/omit-tag-weights.tsv). Six is the fewest that
  #     keeps this leg (about 43 minutes plus setup) no longer than the go
  #     test shards; eight would add two setups and shorten nothing.
  #   workflow_dispatch with `since` (P-222, narrowed): the editions plus
  #     the single sets the diff can touch, in 2 batches.
  #     A tag push skips the job when a green dispatch run already covers
  #     its sha (plan job, `proven` step).
  # ----------------------------------------------------------------
  omit-tags:
    name: omit tags ${{ matrix.name }}
    needs: plan
    # omit is [] only on a tag run whose sha a green full dispatch already
    # covers (the plan job's `proven` step).
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.omit != '[]'
    runs-on: ${{ vars.SBO_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.omit) }}
    steps:
      - uses: actions/checkout@v5
      # One cache family for every batch: build tags only change which files
      # a package selects, so the untagged packages compile identically.
      - uses: ./.github/actions/go-cache
        id: go
        with:
          family: omit-tags
      - name: vet + test
        # One job runs several sets back to back on one warm build cache
        # (D-609); each set is a log group and a failing set is named in an
        # ::error line, so a batch still reports per set.
        run: scripts/omit-tag-check.sh ${{ matrix.args }}
      # Saved from a dispatched FULL run only (D-609): its batches compile
      # every tag set, the per-push job only the distro sets.
      - name: save go cache (full run, batch 0 only)
        if: ${{ !cancelled() && matrix.name == 'batch 0/6' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.go.outputs.gocache }}
            ${{ steps.go.outputs.gomodcache }}
          key: ${{ steps.go.outputs.key }}

  # ----------------------------------------------------------------
  # Plugin-manifest drift gate. plugins/plugingen derives the in-tool
  # plugin manifests (Claude Code plugin + marketplace catalog, Cursor
  # MCP install deeplink, Gemini CLI extension, Goose listing, Codex
  # plugin + catalog, OpenCode package wiring) by RUNNING the real
  # `observer init` registrars — internal/mcp's Registrar and
  # internal/hook's Registry — against a throwaway sandbox HOME. It is
  # invoked by hand (`make plugins-build`), so a registrar change (new
  # hook event, changed MCP argument) could ship with the published
  # plugin still declaring the old wiring. This job closes that gap
  # exactly like track-build-drift: regenerate into a scratch copy, diff,
  # never mutate the working tree. See
  # docs/plans/adapter-plugins-distribution-plan-2026-07-31.md §3.
  #
  # node + web deps are here for the SECOND half of the gate: the
  # OpenCode package's hand-written TypeScript is parsed with the esbuild
  # vendored in web/node_modules (the verify-taxonomy-ts pattern), so a
  # syntax error in glue the Go tests can only substring-check cannot
  # reach an operator's `npm publish`. Nothing is installed for the
  # plugin itself.
  # ----------------------------------------------------------------
  plugins-build-drift:
    name: plugin manifest drift
    needs: plan
    if: needs.plan.outputs.run == 'true' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ vars.SBO_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false # the restore collides with the go.mod toolchain download (D-612)
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: npm ci
        run: |
          cd web
          npm ci
      - name: Verify
        run: make verify-plugins-build
      # The public-repo assembly is a SECOND transpose on top of the
      # generated tree (directory-per-surface -> repository-root, plus the
      # release restamp), and it carries its own honesty gate. --self-check
      # assembles twice into mktemp dirs, byte-diffs them and removes them,
      # so a broken assembler or a README whose install-section anchors
      # moved fails here rather than at publish time. It writes nothing
      # into the working tree and publishes nothing.
      - name: Verify plugins-repo assembly
        run: bash scripts/assemble-plugins-repo.sh --self-check

  # ----------------------------------------------------------------
  # Action-taxonomy drift gate. web/taxgen mirrors internal/tooltax —
  # the one owner of the cross-adapter tool/MCP taxonomy — into
  # web/src/lib/actiontax.gen.*, which web/src/lib/actions.ts reads
  # for its categories, action-type labels and MCP parse rules. It is
  # invoked by hand (`make taxonomy-build`), so a new action type or
  # category could ship with the dashboard still rendering the old
  # vocabulary — which is exactly how the frontend grew its own
  # divergent taxonomy before WP-T1. Same shape as plugins-build-drift:
  # regenerate into a scratch dir, byte-diff, never mutate the working
  # tree. See
  # docs/plans/tool-taxonomy-standardization-plan-2026-07-31.md §1/§7.
  #
  # The second step is the CROSS-LANGUAGE half: the drift gate only
  # proves the generated files match Go, so this compiles the real
  # actions.ts (esbuild) and runs it against the generated vectors. It
  # needs node + web deps — hence the setup-node/npm ci steps here,
  # mirroring the frontend job — because a Go-side reference
  # implementation of the TypeScript parser can only prove Go agrees
  # with Go.
  # ----------------------------------------------------------------
  taxonomy-build-drift:
    name: action taxonomy drift
    needs: plan
    if: needs.plan.outputs.run == 'true' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ vars.SBO_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false # the restore collides with the go.mod toolchain download (D-612)
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: npm ci
        run: |
          cd web
          npm ci
      - name: Verify generated artifacts
        run: make verify-taxonomy-build
      - name: Verify the real TypeScript against the Go oracle
        run: make verify-taxonomy-ts
      - name: Verify the generated backfill migration
        run: make verify-taxonomy-migration
      - name: Verify the generated assistant-text relabel migration
        run: make verify-assistant-migration
      - name: Verify the generated reasoning convergence migration
        run: make verify-reasoning-migration
      - name: Verify the generated dashboard config schema
        run: make verify-config-schema
      - name: Verify the generated adapter settings catalogue
        run: make verify-agentconfig-catalog
      - name: Verify the webcloud portal dist matches source
        # webcloud is an npm workspace member (root package-lock.json), so its
        # own npm ci here — separate from the web/ install above, which the
        # setup-node cache is scoped to.
        run: |
          cd webcloud
          npm ci
          cd ..
          make verify-webcloud-dist

