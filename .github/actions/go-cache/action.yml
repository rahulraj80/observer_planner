# go-cache: setup-go plus a per-job-family build/module cache (restore only).
#
# Why not setup-go's own `cache: true`: its key is OS + Go version +
# hash(go.sum), so it is written once per go.sum change by whichever job
# finishes first (usually a 40 second job), and every race shard, distro
# build and omit-tag job then restores a stale, mostly empty GOCACHE and
# recompiles the tree. Here each job family gets its own key, refreshed by
# the full runs on main (the key carries the commit sha) and falling back to
# the newest entry of the same family.
#
# Restore only. The caller saves with actions/cache/save, gated to a
# workflow_dispatch on main (D-612: pushes and pull requests restore only;
# the nightly schedule that also saved was removed 2026-10-20), using this
# action's `key`, `gocache` and `gomodcache` outputs:
#
#   - uses: ./.github/actions/go-cache
#     id: go
#     with: { family: go-test }
#   ...
#   - if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' }}
#     uses: actions/cache/save@v4
#     with:
#       path: |
#         ${{ steps.go.outputs.gocache }}
#         ${{ steps.go.outputs.gomodcache }}
#       key: ${{ steps.go.outputs.key }}
#
# Saving only from main keeps the repository under its cache budget, and a
# cache written on main is readable from every branch and pull request.
# Go also caches test RESULTS in GOCACHE, so test steps that must always run
# keep -count=1.
name: go-cache
description: setup-go plus a restore of a per-job-family GOCACHE and GOMODCACHE
inputs:
  family:
    description: Job family name, unique per cache population (e.g. go-test-3, distro-minimal, omit-tags)
    required: true
  go-version-file:
    description: go.mod to read the Go version from
    required: false
    default: go.mod
  go-sum:
    description: go.sum whose hash is part of the key
    required: false
    default: go.sum
  free-disk:
    description: >-
      'false' skips removing the runner's unused SDKs before the restore. Only
      for a small family (the plan job restores `lint`, about 0.8 GB): the
      large families need the room.
    required: false
    default: 'true'
outputs:
  key:
    description: The exact key to save under
    value: ${{ steps.key.outputs.key }}
  gocache:
    description: GOCACHE path
    value: ${{ steps.paths.outputs.gocache }}
  gomodcache:
    description: GOMODCACHE path
    value: ${{ steps.paths.outputs.gomodcache }}
  cache-hit:
    description: true when the exact key was restored
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    # Hosted runners have started failing the restore below with "No space
    # left on device" (2026-10-15, runner 2.337.0): the go family's GOCACHE
    # plus GOMODCACHE no longer fits beside the preinstalled toolchains.
    # Drop the large SDKs no job here uses before restoring.
    #
    # One rm per tree, in parallel (lane CICD, 2026-11-01): a single
    # sequential rm of all six trees took 53 to 148 s (median about 100 s)
    # in every Go job of the v1.37.0 full run, about 25 billed minutes per
    # full run across 15 jobs and the first 1.5 minutes of the critical
    # path. The go job's own parallel step frees the same trees in about
    # 50 s. Unlinking is bound by file count, so the slowest tree sets the
    # time. A failed rm leaves less free disk, never a wrong result, as
    # before (the old step ended in || true).
    - shell: bash
      if: runner.os == 'Linux' && inputs.free-disk == 'true'
      run: |
        before=$(df -BG --output=avail / | tail -1)
        start=$SECONDS
        for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift; do
          sudo rm -rf "$d" &
        done
        wait || true
        echo "free disk on /: ${before} -> $(df -BG --output=avail / | tail -1) in $((SECONDS - start))s"

    - uses: actions/setup-go@v6
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: false

    - id: paths
      shell: bash
      run: |
        echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "goversion=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

    - id: key
      shell: bash
      env:
        PREFIX: go-${{ inputs.family }}-${{ runner.os }}-${{ steps.paths.outputs.goversion }}-${{ hashFiles(inputs.go-sum) }}
      run: |
        echo "prefix=${PREFIX}-" >> "$GITHUB_OUTPUT"
        echo "key=${PREFIX}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.paths.outputs.gocache }}
          ${{ steps.paths.outputs.gomodcache }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.prefix }}
          go-${{ inputs.family }}-${{ runner.os }}-${{ steps.paths.outputs.goversion }}-
