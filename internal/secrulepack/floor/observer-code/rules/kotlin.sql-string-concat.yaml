rules:
  - id: kotlin.sql-string-concat
    languages: [kotlin]
    severity: ERROR
    message: Web request input is pasted into SQL text; use a PreparedStatement with ? parameters, named parameters or a query DSL instead.
    metadata:
      category: code_vuln
      cwe: CWE-89
    mode: taint
    pattern-sources:
      # Spring and JAX-RS handler parameters that carry text.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $FN(..., @$A $P: $T, ...) { ... }
              - pattern-inside: |
                  fun $FN(..., @$A(...) $P: $T, ...) { ... }
              - pattern-inside: |
                  fun $FN(..., @$A $P: $T, ...): $RT { ... }
              - pattern-inside: |
                  fun $FN(..., @$A(...) $P: $T, ...): $RT { ... }
              - pattern-inside: |
                  fun $FN(..., @$A $P: $T, ...) = $E
              - pattern-inside: |
                  fun $FN(..., @$A(...) $P: $T, ...) = $E
          - pattern: $P
          - metavariable-regex:
              metavariable: $A
              regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|QueryParam|PathParam|FormParam)$
          - metavariable-regex:
              metavariable: $T
              regex: ^(String|List<String>|Set<String>|Collection<String>|Array<String>|CharSequence)\??$
      # Servlet requests, by call or by Kotlin property.
      - patterns:
          - pattern-either:
              - pattern: $REQ.$GET(...)
              - pattern: $REQ.$GET
          - metavariable-regex:
              metavariable: $REQ
              regex: (?i)^(req|request|httpRequest|servletRequest|httpServletRequest)$
          - metavariable-regex:
              metavariable: $GET
              regex: ^(getParameter|getParameterValues|getParameterMap|getHeader|getHeaders|getQueryString|getCookies|getPathInfo|getRequestURI|getInputStream|getReader|parameterMap|queryString|cookies|pathInfo|requestURI|inputStream|reader)$
      # Ktor.
      - pattern: call.parameters
      - pattern: call.request.queryParameters
      - pattern: call.request.headers
      - pattern: call.request.cookies
      - pattern: call.request.uri
      - pattern: call.receiveText()
      - pattern: call.receiveParameters()
      - pattern: call.receive<String>()
    pattern-sanitizers:
      - pattern: $X.toInt()
      - pattern: $X?.toInt()
      - pattern: $X.toLong()
      - pattern: $X?.toLong()
      - pattern: $X.toIntOrNull()
      - pattern: $X?.toIntOrNull()
      - pattern: $X.toLongOrNull()
      - pattern: $X?.toLongOrNull()
      - pattern: Integer.parseInt(...)
      - pattern: java.lang.Long.parseLong(...)
      - pattern: UUID.fromString(...)
    pattern-sinks:
      # The receiver is a SQL API by its conventional name (JDBC, Spring
      # JDBC, JPA, R2DBC); a service's own update(dto) is not SQL.
      - patterns:
          - pattern: $DB.$Q($SQL, ...)
          - metavariable-regex:
              metavariable: $Q
              regex: ^(executeQuery|executeUpdate|execute|executeLargeUpdate|prepareStatement|prepareCall|addBatch|createQuery|createNativeQuery|createSQLQuery|queryForObject|queryForList|queryForMap|queryForRowSet|query|update|batchUpdate|sql)$
          - metavariable-regex:
              metavariable: $DB
              regex: ^(this\.)?(st|stmt|statement|ps|pstmt|conn|connection|con|db|jdbc|jdbcTemplate|jdbcOperations|namedJdbc|namedParameterJdbcTemplate|em|entityManager|hibernateSession|session|databaseClient|dbClient)$
          - focus-metavariable: $SQL
      # Exposed's raw statement inside a transaction.
      - patterns:
          - pattern-inside: |
              transaction { ... }
          - pattern: exec($SQL, ...)
          - focus-metavariable: $SQL
