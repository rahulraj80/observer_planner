rules:
  - id: kotlin.shell-interpolation
    languages: [kotlin]
    severity: ERROR
    message: Web request input reaches a shell command line; run the program directly with a fixed argument list (ProcessBuilder with separate arguments) instead.
    metadata:
      category: code_vuln
      cwe: CWE-78
    mode: taint
    pattern-sources:
      # Spring and JAX-RS handler parameters that carry text.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $FN(..., @$A $P: $T, ...) { ... }
              - pattern-inside: |
                  fun $FN(..., @$A(...) $P: $T, ...) { ... }
              - pattern-inside: |
                  fun $FN(..., @$A $P: $T, ...): $RT { ... }
              - pattern-inside: |
                  fun $FN(..., @$A(...) $P: $T, ...): $RT { ... }
              - pattern-inside: |
                  fun $FN(..., @$A $P: $T, ...) = $E
              - pattern-inside: |
                  fun $FN(..., @$A(...) $P: $T, ...) = $E
          - pattern: $P
          - metavariable-regex:
              metavariable: $A
              regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|QueryParam|PathParam|FormParam|HeaderParam)$
          - metavariable-regex:
              metavariable: $T
              regex: ^(String|List<String>|Set<String>|Collection<String>|Array<String>|CharSequence)\??$
      # Servlet requests, by call or by Kotlin property.
      - patterns:
          - pattern-either:
              - pattern: $REQ.$GET(...)
              - pattern: $REQ.$GET
          - metavariable-regex:
              metavariable: $REQ
              regex: (?i)^(req|request|httpRequest|servletRequest|httpServletRequest)$
          - metavariable-regex:
              metavariable: $GET
              regex: ^(getParameter|getParameterValues|getParameterMap|getHeader|getHeaders|getQueryString|getCookies|getPathInfo|getRequestURI|getInputStream|getReader|parameterMap|queryString|cookies|pathInfo|requestURI|inputStream|reader)$
      # Ktor.
      - pattern: call.parameters
      - pattern: call.request.queryParameters
      - pattern: call.request.headers
      - pattern: call.request.cookies
      - pattern: call.request.uri
      - pattern: call.receiveText()
      - pattern: call.receiveParameters()
      - pattern: call.receive<String>()
    pattern-sanitizers:
      - pattern: $X.toInt()
      - pattern: $X?.toInt()
      - pattern: $X.toLong()
      - pattern: $X?.toLong()
      - pattern: $X.toIntOrNull()
      - pattern: $X?.toIntOrNull()
      - pattern: $X.toLongOrNull()
      - pattern: $X?.toLongOrNull()
      - pattern: Integer.parseInt(...)
      - pattern: java.lang.Long.parseLong(...)
      - pattern: UUID.fromString(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: ProcessBuilder("$SH", "$C", ..., $X, ...)
              - pattern: ProcessBuilder(listOf("$SH", "$C", ..., $X, ...))
              - pattern: Runtime.getRuntime().exec(arrayOf("$SH", "$C", ..., $X, ...))
              - pattern: $PB.command("$SH", "$C", ..., $X, ...)
          - metavariable-regex:
              metavariable: $SH
              regex: ^(sh|bash|zsh|/bin/sh|/bin/bash|cmd|cmd\.exe|powershell|powershell\.exe|pwsh)$
          - metavariable-regex:
              metavariable: $C
              regex: ^(-c|/c|/C|-Command)$
          - focus-metavariable: $X
      # One command string, split on spaces by Runtime.exec: the input picks
      # the program or its arguments.
      - patterns:
          - pattern: Runtime.getRuntime().exec($X, ...)
          - pattern-not: Runtime.getRuntime().exec(arrayOf(...), ...)
          - focus-metavariable: $X
