rules:
  - id: kotlin.unsafe-deserialization
    languages: [kotlin]
    severity: ERROR
    message: Data is deserialized with a loader that can build arbitrary classes (Java serialization, XMLDecoder, XStream, SnakeYAML's default constructor or Jackson default typing), so crafted input can run code; use a safe format or an allow-list filter.
    metadata:
      category: code_vuln
      cwe: CWE-502
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: ObjectInputStream(...).readObject()
              - pattern: ObjectInputStream(...).readUnshared()
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          val $O = ObjectInputStream(...)
                          ...
                      - pattern-inside: |
                          ObjectInputStream(...).use { $O -> ... }
                  - pattern-either:
                      - pattern: $O.readObject()
                      - pattern: $O.readUnshared()
          - pattern-not-inside: |
              $O.setObjectInputFilter(...)
              ...
          - pattern-not-inside: |
              $O.objectInputFilter = $FILTER
              ...
      - pattern: XMLDecoder(...).readObject()
      - patterns:
          - pattern-inside: |
              val $D = XMLDecoder(...)
              ...
          - pattern: $D.readObject()
      - pattern: XStream(...).fromXML(...)
      - patterns:
          - pattern-inside: |
              val $X = XStream(...)
              ...
          - pattern: $X.fromXML(...)
      - pattern: Yaml().load(...)
      - pattern: Yaml().loadAll(...)
      - pattern: $M.enableDefaultTyping(...)
      - pattern: $M.activateDefaultTyping(...)
