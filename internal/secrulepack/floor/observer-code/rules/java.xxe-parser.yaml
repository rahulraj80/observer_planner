rules:
  - id: java.xxe-parser
    languages: [java]
    severity: ERROR
    message: An XML parser factory is used without turning off DOCTYPE declarations or external entities, so a document can read local files or reach internal hosts; set the disallow-doctype-decl feature (or the external-entity features off) before parsing.
    metadata:
      category: code_vuln
      cwe: CWE-611
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $F = $FACT.newInstance(...);
                  - pattern: $F = $FACT.newFactory(...);
                  - pattern: $F = $FACT.newDefaultFactory(...);
                  # Used inline, the factory can have no setting at all.
                  - pattern: $FACT.newInstance(...).$NEW(...)
                  - pattern: $FACT.newFactory(...).$NEW(...)
              - metavariable-regex:
                  metavariable: $FACT
                  regex: ^(DocumentBuilderFactory|SAXParserFactory|XMLInputFactory|TransformerFactory|SAXTransformerFactory)$
          # dom4j and JDOM2 readers.
          - patterns:
              - pattern: $F = new $PARSER(...);
              - metavariable-regex:
                  metavariable: $PARSER
                  regex: ^(SAXReader|SAXBuilder)$
      # A safe setting on the same factory later in the same function.
      - pattern-not-inside: |
          $F = $X;
          ...
          $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
      - pattern-not-inside: |
          $F = $X;
          ...
          $F.setFeature("http://xml.org/sax/features/external-general-entities", false);
      - pattern-not-inside: |
          $F = $X;
          ...
          $F.setAttribute(XMLConstants.ACCESS_EXTERNAL_DTD, "");
      - pattern-not-inside: |
          $F = $X;
          ...
          $F.setAttribute(javax.xml.XMLConstants.ACCESS_EXTERNAL_DTD, "");
      - pattern-not-inside: |
          $F = $X;
          ...
          $F.setProperty(XMLConstants.ACCESS_EXTERNAL_DTD, "");
      - pattern-not-inside: |
          $F = $X;
          ...
          $F.setProperty(XMLInputFactory.SUPPORT_DTD, false);
      - pattern-not-inside: |
          $F = $X;
          ...
          $F.setProperty("javax.xml.stream.supportDTD", false);
      - pattern-not-inside: |
          $F = $X;
          ...
          $F.setProperty(XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES, false);
      - pattern-not-inside: |
          $F = $X;
          ...
          $F.setExpandEntities(false);
