# superbased-observer cloud-session: generated by `observer cloud-session init`, remove with `observer cloud-session remove`. sha256:bc368385ac847df2dc3ed7a42ee9d99f6dcbc8712df52942172c442b2ddaa0e9
name: Copilot setup steps
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install SuperBased Observer (cloud-session)
        run: sudo sh .superbased/cloud-session/setup.sh
