# Synthetic Gradle version catalog for the facade's extraction test.
[versions]
guava = "33.3.1-jre"
junit = "[5.10,6.0)"

[libraries]
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-lang3 = "org.apache.commons:commons-lang3:3.17.0"
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.+" }
compose-ui = { module = "androidx.compose.ui:ui" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.0.21" }
